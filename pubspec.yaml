name: dukan_khata
description: "Urdu-first shop inventory + daily khata for an auto repair / spare-parts shop."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Supabase backend (auth, postgres, storage)
  supabase_flutter: ^2.8.0

  # State management
  flutter_riverpod: ^2.6.1

  # Typed navigation
  go_router: ^14.6.0

  # Voice input (Phase 4)
  speech_to_text: ^7.5.0

  # Product photos
  image_picker: ^1.1.0

  # Compress images before upload
  image: ^4.5.1

  # Compile-time env config (URL + anon key) injected via --dart-define
  shared_preferences: ^2.5.3

  # Local-first business database
  sqflite: ^2.4.1
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: Share-Send-File--Streamline-Flex.png
  remove_alpha_ios: false

flutter:
  uses-material-design: true